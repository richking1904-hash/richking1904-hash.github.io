<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeMi Magazine Style | JHG</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Noto+Sans+KR:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans KR', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .magazine-card {
            width: 90%;
            max-width: 380px;
            height: 580px;
            border-radius: 45px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .photo-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('photo.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.9) contrast(1.05); 
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0.5) 0%, 
                rgba(0,0,0,0) 20%, 
                rgba(0,0,0,0) 60%, 
                rgba(0,0,0,0.8) 100%);
            z-index: 2;
        }

        .text-layer {
            position: relative;
            z-index: 3;
            height: 100%;
            padding: 40px 30px 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
            box-sizing: border-box;
        }

        .top-info {
            text-align: left;
            margin-top: -10px; 
        }

        .brand-logo {
            font-family: 'Libre Baskerville', serif;
            font-size: 1rem;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #fff; 
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .name-main {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 5px;
            letter-spacing: -1px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.6);
        }

        .role-sub {
            font-size: 0.75rem;
            font-weight: 700; 
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        .footer-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-text {
            font-size: 0.75rem;
            line-height: 1.4;
            font-weight: 400; 
            padding-left: 10px;
            border-left: 1px solid rgba(255,255,255,0.5);
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 5px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-btn {
            color: #fff;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 0;
            border-radius: 12px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            transition: 0.3s ease;
        }

        .portfolio-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
        }
        
        .nav-btn:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-1px);
        }

        /* -------------------------------------------
           '미니 팝업 챗봇' 스타일 설정 (PC 기준 우하단)
        -------------------------------------------- */
        .gemi-bot-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 말풍선 공지창 */
        .gemi-bot-bubble {
            background-color: #4A8BB2;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            white-space: nowrap;
            cursor: pointer;
            animation: bounce 2s infinite;
            transition: opacity 0.3s ease;
        }

        /* 말풍선 뾰족 삼각형 */
        .gemi-bot-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 20px;
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: #4A8BB2 transparent;
            display: block;
            width: 0;
        }

        /* 둥근 대화형 버튼 */
        .gemi-bot-button {
            width: 56px;
            height: 56px;
            background-color: #4A8BB2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .gemi-bot-button:hover {
            transform: scale(1.08);
            background-color: #3b7396;
        }

        .gemi-bot-icon {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }

        /* 팝업 대화창 (PC 기준) */
        .gemi-chat-window {
            position: fixed;
            bottom: 95px;
            right: 24px;
            width: 370px;
            height: 550px;
            max-height: 80vh; 
            max-width: 90vw;
            background-color: #F8F8F8;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            display: none; 
            flex-direction: column;
            overflow: hidden;
            z-index: 10000;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .gemi-chat-window iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 닫기 버튼 */
        .gemi-chat-close {
            position: absolute;
            top: 12px;
            right: 15px;
            width: 28px;
            height: 28px;
            background-color: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10001;
            transition: background-color 0.2s;
        }

        .gemi-chat-close:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* -------------------------------------------
           📱 모바일 전용 반응형 스타일 보정 (우측 중앙 이동)
        -------------------------------------------- */
        @media (max-width: 600px) {
            /* 1. 모바일에서 챗봇 버튼 위치를 우측 중앙으로 보냅니다 */
            .gemi-bot-container {
                bottom: auto; /* 하단 고정 해제 */
                top: 50%;     /* 화면 세로 높이의 딱 절반 위치 */
                transform: translateY(-50%); /* 정확히 정중앙 정렬을 위한 보정 */
                right: 16px;   /* 우측 여백 */
            }

            /* 2. 모바일 중간에 위치하므로 말풍선 알림도 완벽하게 다시 띄웁니다! */
            .gemi-bot-bubble {
                display: block !important;
                font-size: 11px; /* 모바일용 크기 축소 */
                padding: 8px 12px;
                margin-bottom: 8px;
            }

            /* 말풍선 뾰족 삼각형 위치를 버튼 중심으로 약간 우측 정렬 */
            .gemi-bot-bubble::after {
                right: 15px;
            }

            .gemi-bot-button {
                width: 48px;
                height: 48px;
            }

            .gemi-bot-icon {
                width: 22px;
                height: 22px;
            }

            /* 3. 모바일 우측 중간에서 열리는 팝업창 위치 세팅 */
            .gemi-chat-window {
                top: 50%;
                bottom: auto;
                transform: translateY(-50%);
                right: 16px;
                width: calc(100vw - 32px);
                height: 70vh;
            }
        }
    </style>
</head>
<body>

    <div class="magazine-card">
        <div class="photo-bg"></div>
        <div class="overlay"></div>

        <div class="text-layer">
            <div class="top-info">
                <div class="brand-logo">GeMi</div>
                <div class="name-main">장형규</div>
                <div class="role-sub">Brand Designer</div>
            </div>

            <div class="footer-content">
                <div class="contact-text">
                    GeMi 웹명함 디자인<br>
                    richbab@naver.com
                </div>

                <div class="button-group">
                    <div style="display: flex; gap: 8px; width: 100%;">
                        <a href="https://www.instagram.com/gemii_jh" target="_blank" class="nav-btn" style="flex: 1;">INSTAGRAM</a>
                        <a href="https://blog.naver.com/richbab" target="_blank" class="nav-btn" style="flex: 1;">NAVER BLOG</a>
                    </div>
                    <a href="portfolio.html" class="nav-btn portfolio-btn">PORTFOLIO</a>
                </div>
            </div>
        </div>
    </div>

    <div class="gemi-bot-container">
        <div class="gemi-bot-bubble" id="botBubble" onclick="toggleChat()">
            GeMi 스마트 비서 시작하기!
        </div>
        <div class="gemi-bot-button" onclick="toggleChat()">
            <svg class="gemi-bot-icon" viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
            </svg>
        </div>
    </div>

    <div class="gemi-chat-window" id="chatWindow">
        <div class="gemi-chat-close" onclick="toggleChat()">X</div>
        <iframe src="https://typebot.co/my-typebot-eri41u9" allow="geolocation; microphone; camera"></iframe>
    </div>

    <script>
        function toggleChat() {
            var chatWindow = document.getElementById('chatWindow');
            var botBubble = document.getElementById('botBubble');
            
            if (chatWindow.style.display === 'none' || chatWindow.style.display === '') {
                chatWindow.style.display = 'flex'; 
                botBubble.style.opacity = '0';     
                botBubble.style.pointerEvents = 'none';
            } else {
                chatWindow.style.display = 'none';  
                botBubble.style.opacity = '1';      
                botBubble.style.pointerEvents = 'auto';
            }
        }
    </script>

</body>
</html>
